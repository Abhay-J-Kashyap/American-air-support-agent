[project]
name = "aa-support-agent"
version = "0.1.0"
description = "AI support agent for @AmericanAir, built on the Customer Support on Twitter dataset"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    # fastembed runs all-MiniLM-L6-v2 on ONNX Runtime: ~50MB installed.
    # sentence-transformers pulls PyTorch (~2.5GB) for the identical vectors.
    # See DECISIONS.md #12.
    "fastembed>=0.3",
    "datasketch>=1.6",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

# Only if you want to swap the embedding backend back to torch.
torch = ["sentence-transformers>=3.0"]

[project.scripts]
aa = "aa_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as argument defaults by design.
"src/aa_agent/cli.py" = ["B008"]
# Tests reach into private limiter state deliberately, and the raw-CSV
# fixture in test_ingest.py can't be line-wrapped without corrupting it.
"tests/*" = ["SLF001", "E501"]

[tool.mypy]
python_version = "3.10"
packages = ["aa_agent"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: hits real provider APIs; excluded from CI"]
