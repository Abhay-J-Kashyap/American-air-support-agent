project:
  brand: AmericanAir
  seed: 20260909
  cache_path: artifacts/llm_cache.jsonl

# Per-provider transport + published free-tier limits.
# These are CEILINGS we self-impose; the real limits live in response headers.
# `make check-providers` prints what the API actually reports. Free-tier
# model catalogs move fast -- see DECISIONS.md #13-15 for what happened the
# first time we ran this against live keys.
providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    rpm: 30
    tpm: 6000
    max_context_tokens: 128000
    enabled: true

  # Disabled for this account: gpt-oss-120b (the only model in Cerebras's
  # public production catalog) returns 402 Payment Required despite
  # third-party trackers advertising a perpetual no-card free tier.
  # Cerebras's own current pricing structure is a one-time $5 trial credit
  # plus a paid Developer tier -- that matches the observed 402 better than
  # the aggregator claims did. See DECISIONS.md #14. Re-enable only after
  # confirming billing status directly at cloud.cerebras.ai -- never take a
  # blog's "free tier" claim over a live 402 from the provider itself.
  cerebras:
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    rpm: 30
    tpm: 30000
    max_context_tokens: 8192
    enabled: false

  mistral:
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    # Free "Experiment" tier is documented at ~1 request/second; 60 rpm is
    # that same ceiling expressed per-minute, not a separate guess.
    rpm: 60
    tpm: 50000
    max_context_tokens: 32000
    enabled: true

  # Fallback only. Free variants are 20 RPM / 50 requests per DAY on an
  # unfunded account, and failed calls still burn quota. Never primary.
  # Free-variant availability also flaps with upstream capacity -- a 404
  # here doesn't always mean the slug is wrong, just that it's momentarily
  # unavailable. Check https://openrouter.ai/models?max_price=0 for the
  # live list before assuming a slug is stale.
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    rpm: 20
    tpm: 100000
    rpd: 50
    max_context_tokens: 32000
    enabled: true

# Roles, not models. Swapping a provider is a config edit, never a refactor.
roles:
  classifier:
    temperature: 0.0
    # gpt-oss is a REASONING model: it spends max_tokens on internal
    # reasoning before emitting any answer. At 200 the budget was exhausted
    # during reasoning and `content` came back empty with a 200 status --
    # which silently left 21.6% of the intent corpus unlabelled on the first
    # real run. See DECISIONS.md #32.
    max_tokens: 1200
    extra_params:
      reasoning_effort: low      # low | medium | high (medium is default)
      reasoning_format: hidden   # 'parsed' or 'hidden' REQUIRED with JSON mode
    primary: {provider: groq, model: "openai/gpt-oss-20b"}
    fallbacks:
      - {provider: openrouter, model: "openai/gpt-oss-20b:free"}

  # qwen3.6-27b is flagged "preview" by Groq (evaluation, not production).
  # Accepted here because it's what keeps the drafter's model family
  # distinct from judge_a, which also lives on Groq post-Cerebras. Flag
  # this as a limitation in the report if judge_a's scores look odd.
  drafter:
    temperature: 0.3
    # qwen3 supports reasoning_effort 'none' to disable reasoning entirely.
    # Drafting a two-sentence support reply needs no chain of thought, and
    # disabling it removes the empty-content failure mode outright.
    max_tokens: 800
    extra_params:
      reasoning_effort: none
    primary: {provider: groq, model: "qwen/qwen3.6-27b"}
    fallbacks:
      - {provider: openrouter, model: "deepseek/deepseek-chat-v3.1:free"}

  # judge_b (Mistral) is the ONE judge with full independence -- different
  # provider AND different model family from the drafter. judge_a shares a
  # provider with the drafter now that Cerebras is disabled; it still
  # differs in model family (openai/gpt-oss vs qwen). See DECISIONS.md #15
  # for why, and report it as a possible shared-infrastructure confound.
  judge_a:
    temperature: 0.0
    # Same reasoning-budget caveat as the classifier, but judges need room
    # to actually reason -- that's the point of using a reasoning model here.
    max_tokens: 2000
    extra_params:
      reasoning_effort: medium
      reasoning_format: hidden
    primary: {provider: groq, model: "openai/gpt-oss-120b"}
    fallbacks:
      - {provider: openrouter, model: "openai/gpt-oss-120b:free"}

  judge_b:
    temperature: 0.0
    max_tokens: 600
    primary: {provider: mistral, model: mistral-small-latest}
    fallbacks: []

embedding:
  # Served via fastembed/ONNX (~50MB) rather than torch (~2.5GB).
  backend: fastembed
  model: BAAI/bge-small-en-v1.5
  dim: 384
  dtype: float16

# The CURATED taxonomy -- source of truth for all downstream stages.
# Never written by the tool; `discover-intents` only writes a proposal to
# artifacts/intents/taxonomy.json. See DECISIONS.md #37.
taxonomy_path: config/taxonomy.yaml

data:
  raw_csv: data/twcs.csv
  brand_parquet: artifacts/american_air.parquet
  # Time-based split: index on the earlier window, evaluate on the later one.
  # A random split leaks near-duplicate storm-event tweets across the
  # boundary and inflates retrieval scores. See DECISIONS.md #4.
  split_quantile: 0.7
  near_duplicate_cosine: 0.95

golden:
  size: 200
  stratum_a: 100   # uniform random -> the only stratum quotable as a population estimate
  stratum_b: 100   # stratified + adversarial -> coverage, NOT a population estimate
