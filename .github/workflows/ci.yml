name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Typecheck
        run: mypy

      # No API keys in CI. Every test either uses a fake clock, a tmp_path
      # cache, or asserts on config invariants. Anything marked `live` is
      # excluded -- CI must never depend on a free tier being up.
      - name: Test
        run: pytest -m "not live" --cov=aa_agent --cov-report=term-missing

  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # The claim in the README is that a grader can reproduce the headline
      # numbers from the committed cache in under 15 minutes with no API key.
      # This job is what stops that claim from rotting.
      - name: Reproduce headline results from cache
        timeout-minutes: 15
        run: |
          if [ -f artifacts/llm_cache.jsonl.gz ]; then
            gunzip -kf artifacts/llm_cache.jsonl.gz
          fi
          make eval
